# House — the HomeScan walkthrough, HTTP only, at http://house.local
#
#   127.0.0.1:3010   webviewer/serve.mjs — the page, the photographs beside it,
#                    and the /api/nano-banana route that holds the Gemini key
#
# The scheme is pinned to http, as budget.local's is: the viewer needs no
# secure context (pointer lock and WebGL work without one), so serving it on
# one name over one scheme skips the self-signed interstitial. The :443 block
# redirects back down rather than proxying, so an old https bookmark lands
# somewhere that works and the app is never reachable at two origins.
#
# Unauthenticated, like the other vhosts on this box. What it exposes is a
# walkthrough of the house and, if a Gemini key is configured in the repo's
# .env, a button that spends that key on one image per press.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name house.local;

    ssl_certificate     /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;

    return 301 http://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name house.local;

    # index.html is ~260 KB of one script; the photographs are already webp.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 512;

    # Nano Banana posts the frame it just drew — a JPEG up to 1536 px wide —
    # and waits on Gemini for the photograph back. Neither fits nginx's
    # defaults: 1 MB bodies and a 60 s upstream read.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        include snippets/proxy-common.conf;
        client_max_body_size 16m;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        include snippets/proxy-common.conf;
    }
}
